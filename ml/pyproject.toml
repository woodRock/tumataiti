[project]
name = "tumataiti-ml"
version = "0.1.0"
description = "Tūmataiti data generation, detectors and evaluation"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
rules = ["tumataiti-rules"]
teacher = ["torch>=2.4", "transformers>=5.6"]

[project.scripts]
tumataiti-ml = "tumataiti_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
tumataiti-rules = { path = "../crates/tumataiti-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tumataiti_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
