# What each paper artifact is built from. Outputs land in <paper>/generated/.

[build]
python = "python3.11"                # has matplotlib (fig_pipeline.py)
# Result keys are <result>/<metric>/<stat>, e.g. \res{mba/f1/mean}.

[artifacts.results]
kind = "macros"
output = "generated/results.tex"
# Every result: the score files in ml/results/ (ml/scripts/export_ledger.py), the
# inventory (ml/scripts/export_inventory.py) and the settings in taura.toml.
results = ["*"]

# A table built straight from results (one row per result):
# [artifacts.table_main]
# kind = "table"
# output = "generated/table_main.tex"
# results = ["mba", "baselines"]
# row_header = "Method"
# labels = { mba = "MBA", baselines = "Baseline" }
# columns = [{ metric = "f1", label = "F1" }]
# bold = "max"                     # bold the best cell per numeric column
#
# Or from a script that writes a JSON table spec (see `taura.api.write_table`):
# script = "artifacts/table_main.py"

# A figure: the script writes a PDF to $TAURA_OUTPUT.
# [artifacts.fig_alignment]
# kind = "figure"
# output = "generated/fig_alignment.pdf"
# script = "artifacts/fig_alignment.py"
# results = ["mba"]

# Number formatting, by metric name or <result>/<metric>.
[format.default]
decimals = 3

# [format.f1]
# decimals = 1
# percent = true                   # 0.912 -> 91.2

# Rates are fractions in the results; the paper prints percentages with one
# decimal (the % sign stays in the .tex), as in ml/results/*.md.
[format.doc_leak]
decimals = 1
percent = true

[format.span_leak]
decimals = 1
percent = true

[format.precision]
decimals = 1
percent = true

[format.recall]
decimals = 1
percent = true

[format.f1]
decimals = 1
percent = true

[format.exact_f1]
decimals = 1
percent = true

[format.ms]
decimals = 1

[format.maori]
decimals = 1
percent = true

[format.pakeha]
decimals = 1
percent = true

[format.pasifika]
decimals = 1
percent = true

[format.asian_nz]
decimals = 1
percent = true

# Māori − Pākehā gap in percentage points, signed.
[format.gap]
decimals = 1
percent = true
sign = true

[format."*/leak_*/*"]
decimals = 1
percent = true

[format."*/*_redacted/*"]
decimals = 1
percent = true

[format."*/*_flagged/*"]
decimals = 1
percent = true

[format."*/*_leaked/*"]
decimals = 1
percent = true

# Inventory and settings (ml/scripts/export_inventory.py, taura.toml).
[format."inventory/docs/*"]
decimals = 0
thousands = true

[format.docs]                      # table column
decimals = 0
thousands = true

[format.templates]
decimals = 0

[format."inventory/mb/*"]          # file sizes in MB
decimals = 0

[format.mb]                        # table column
decimals = 0

[format."inventory/params/*"]      # millions of parameters
decimals = 0

[format."settings-train/Config.lr"]
sci = true
decimals = 0

[format."settings-train/Config.warmup"]
percent = true
decimals = 0

[format."settings-train/Config.weight_decay"]
decimals = 2

[format."settings-lexicon/*"]      # community shares: 50\%
percent = true
decimals = 0

# False-alarm table columns (shares of non-PII slots redacted).
[format.kin_redacted]
decimals = 0
percent = true

[format.order_ref_redacted]
decimals = 0
percent = true

[format.booking_code_redacted]
decimals = 0
percent = true

[format.kin_flagged]
decimals = 0
percent = true

# Tables (artifacts/table_*.py write a taura table spec).
[artifacts.table_data]
kind = "table"
output = "generated/table_data.tex"
script = "artifacts/table_data.py"
results = ["inventory"]
colspec = "@{}llrr@{}"

[artifacts.table_main]
kind = "table"
output = "generated/table_main.tex"
script = "artifacts/table_main.py"
results = ["inventory", "m3open_nz_test_full", "m3open_open_en_test", "m3open_pii300k_en_val",
           "m3open_int4_nz_test_full", "m3open_int4_open_en_test", "m3open_int4_pii300k_en_val"]
colspec = "@{}lrrrrr@{}"
bold = "min"                       # the lowest leak rate per test set

[artifacts.table_names]
kind = "table"
output = "generated/table_names.tex"
script = "artifacts/table_names.py"
results = ["m3open_names_counterfactual", "m3open_int4_names_counterfactual"]
colspec = "@{}lrrrrr@{}"

[artifacts.table_quant]
kind = "table"
output = "generated/table_quant.tex"
script = "artifacts/table_quant.py"
results = ["inventory", "m3open_quant_nz_test_full"]
colspec = "@{}lrrrrrrrr@{}"

[artifacts.table_false_alarms]
kind = "table"
output = "generated/table_false_alarms.tex"
script = "artifacts/table_false_alarms.py"
results = ["m3fa_nz_test_full", "m3fa_names_counterfactual", "m3fa_open_en_test", "m3fa_pii300k_en_val",
           "m3fa_false_alarms"]
colspec = "@{}lrrrrrr@{}"

[artifacts.fig_pipeline]
kind = "figure"
output = "generated/fig_pipeline.pdf"
script = "artifacts/fig_pipeline.py"

[artifacts.fig_example]
kind = "figure"
output = "generated/fig_example.pdf"
script = "artifacts/fig_example.py"
# artifacts/data/example_redaction.json, written by ml/scripts/export_example.py

[artifacts.fig_names]
kind = "figure"
output = "generated/fig_names.pdf"
script = "artifacts/fig_names.py"
results = ["m3open_names_counterfactual", "m3open_int4_names_counterfactual"]

[artifacts.fig_quant]
kind = "figure"
output = "generated/fig_quant.pdf"
script = "artifacts/fig_quant.py"
results = ["inventory", "m3open_quant_nz_test_full"]

[format.ms_p90]
decimals = 1

[format."m3fa_kinwords_false_alarms/*"]   # kinship false alarms, per word: 54\%
decimals = 0
percent = true

[format."uncertainty_nz_test_full/*"]
decimals = 1
percent = true

[format."uncertainty_nz_test_full/gap*/*"]
decimals = 1
percent = true
sign = true

[format."uncertainty_nz_test_full/diff_*/*"]
decimals = 1
percent = true
sign = true

[format."settings-uncertainty/BOOTSTRAPS"]
decimals = 0
thousands = true

[format."settings-uncertainty/CONFIDENCE"]
decimals = 0
percent = true

[format."settings-thresholds/THRESHOLDS/*"]
decimals = 1

[format."inventory/dev_char_f1/*"]
decimals = 1

[format.tmpl]                      # table column, per-template leak rate
decimals = 1
percent = true

[artifacts.table_templates]
kind = "table"
output = "generated/table_templates.tex"
script = "artifacts/table_templates.py"
results = ["uncertainty_nz_test_full"]
colspec = "@{}lrrrr@{}"
bold = "min"

[artifacts.table_robust]
kind = "table"
output = "generated/table_robust.tex"
script = "artifacts/table_robust.py"
results = ["m3open_int4_nz_test_full", "m3open_int4_names_counterfactual",
           "m3open_robust_nomacron_nz_test_full", "m3open_robust_lower_nz_test_full",
           "m3open_robust_nomacron_names_counterfactual", "m3open_robust_lower_names_counterfactual"]
colspec = "@{}lrrrrrr@{}"

[artifacts.fig_thresholds]
kind = "figure"
output = "generated/fig_thresholds.pdf"
script = "artifacts/fig_thresholds.py"
results = ["m3open_thresholds_nz_test_full"]
